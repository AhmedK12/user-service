spring.application.name=user-service
# Set the default password encoder
security.password.encoder=argon2

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/apica_user_journal
spring.datasource.username=root
spring.datasource.password=kali
spring.jpa.hibernate.ddl-auto=update

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings (HikariCP is default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

