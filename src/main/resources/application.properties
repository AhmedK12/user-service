server.port=${SERVER_PORT:9090}
spring.application.name=${APP_NAME:user-service}

# Set the default password encoder
security.password.encoder=${SECURITY_PASSWORD_ENCODER:argon2}

# Database Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/apica_user_journal}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:kali}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}

# JWT Configuration
jwt.secret=${JWT_SECRET:@67$%#!@WE}
jwt.algorithm=${JWT_ALGORITHM:HS256}
jwt.privateKey=${JWT_PRIVATE_KEY:kl}
jwt.publicKey=${JWT_PUBLIC_KEY:lk}
security.jwt.refresh.expiry=${JWT_REFRESH_EXPIRY:12000}
